name: Latest release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: latest-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ReleaseLatest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup npm
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install build dependencies
        run: |
          pip install build
      - name: Build the wheel
        run: |
          python -m build --wheel
      - name: Delete the previous "latest" release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest dist/*.whl \
            --title "Latest release (rolling)" \
            --notes "Rolling release from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --prerelease \

